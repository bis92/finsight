name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 사고 대응 파이프라인의 신호원. 이 워크플로가 push→main 에서 실패하면
# ci-autofix.yml 이 workflow_run 으로 깨어난다.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        # 앱 코드는 NEXT_PUBLIC_* 를 `!` 비-null 단언으로 읽고 모듈 로드시 throw하지 않는다.
        # env 부재로 인한 빌드 오탐을 막기 위한 placeholder (실제 시크릿 아님).
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://ci-placeholder.local
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: phc_ci_placeholder
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
